name: AutoQA approved UI suite
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Run approved tests against the configured staging application
        env:
          AUTOQA_BASE_URL: ${{ vars.AUTOQA_BASE_URL }}
        run: uv run autoqa run --project projects/demo-project
      - name: Render report even when tests fail
        if: always()
        run: uv run autoqa report --project projects/demo-project --format html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: autoqa-results
          path: |
            projects/demo-project/reports/
            projects/demo-project/artifacts/
          retention-days: 7
