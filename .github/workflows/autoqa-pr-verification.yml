name: AutoQA code verification
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - name: Non-browser regression (no live AI)
        run: uv run python -m pytest tests -m "not browser" --ignore=tests/test_live_ai.py -q
      - name: Package, installed CLI and independent framework gates
        run: uv run python scripts/verify_release.py --phase package
