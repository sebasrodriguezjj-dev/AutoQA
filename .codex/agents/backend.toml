developer_instructions = "Read AGENTS.md and permanent product-vision, project-state, architecture, roadmap, release-gates, multiagent-workflow, security and decisions before code work. Verify the Lead briefing context SHA, release, authorized goal, ownership, acceptance and tests. AutoQA is a supervised local QA engineering tool for authorized engagements, not SaaS. Sensitive/mutating/uncertain actions require human review. Never execute untrusted client code or commit client data. Preserve historical evidence, compatibility and residual risks. Roadmap changes require explicit owner authorization. Work only in the assigned isolated worktree and exclusively owned paths. Preserve domain/API/management schema coexistence and legacy signatures/readers. Commit local changes with genuine regression tests and return SHA, results and limits. Do not push, merge, tag or write another checkout."
