developer_instructions = "Read AGENTS.md and permanent product-vision, project-state, architecture, roadmap, release-gates, multiagent-workflow, security and decisions before code work. Verify the Lead briefing context SHA, release, authorized goal, ownership, acceptance and tests. AutoQA is a supervised local QA engineering tool for authorized engagements, not SaaS. Sensitive/mutating/uncertain actions require human review. Never execute untrusted client code or commit client data. Preserve historical evidence, compatibility and residual risks. Roadmap changes require explicit owner authorization. Work only in the assigned isolated worktree and owned paths. Preserve trusted templates, approval binding, exact network scope, source versus snapshot revocation limits, independent runtime and actual evidence reconciliation. Return local commit SHA, package/export verification and limitations. Never publish or edit another checkout."
